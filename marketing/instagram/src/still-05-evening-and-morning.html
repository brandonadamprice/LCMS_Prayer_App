<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still 05 — Evening and morning (Psalm 55:17)</title>
<link rel="stylesheet" href="shared.css">
<style>
    /* Doré 52, Daniel in the Lions' Den — Daniel prayed three times a day
       (Dan. 6:10), which is the verse's own practice. The shaft of light runs
       down the middle of the plate, so hold the scrim heavy up top. */
    body.verse { --scrim-top: 0.72; }
    .verse-art .plate-art { object-position: 50% 62%; }
</style>
</head>
<body class="verse">
    <div class="verse-art">
        <img class="plate-art" src="art/dore-052-daniel-in-the-lions-den.jpg" alt="">
        <div class="tint"></div>
        <div class="scrim"></div>
        <div class="words">Evening and morning and at noon I utter my
            complaint and moan, and he hears my voice.</div>
    </div>
    <div class="verse-plate">
        <div class="ref">Psalm 55:17 <span class="esv">ESV</span></div>
        <div class="hook">Morning &middot; Midday &middot; Evening &middot; Close of Day</div>
    </div>
    <div class="verse-bar">
        <img src="../../../devotions/static/icons/android-chrome-512x512.png" alt="">
        <span class="url">asimplewaytopray.com</span>
    </div>
</body>
</html>
