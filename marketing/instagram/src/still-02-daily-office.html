<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still 02 — The Daily Office</title>
<link rel="stylesheet" href="shared.css">
<style>
    body.still {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 60px 80px 0;
    }

    .eyebrow { font-size: 28px; }

    h1 {
        margin-top: 14px;
        font-size: 88px;
        font-weight: 500;
        color: var(--brand-red);
    }

    .sub {
        margin-top: 18px;
        font-family: var(--sans);
        font-size: 30px;
        color: #6b6560;
    }

    .offices {
        margin-top: 44px;
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 24px;
    }

    .office {
        position: relative;
        height: 176px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 28px rgba(50, 46, 44, 0.22);
    }

    .office img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .office .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgba(35, 20, 17, 0.88) 0%, rgba(35, 20, 17, 0.55) 48%, rgba(35, 20, 17, 0) 80%);
    }

    .office .label {
        position: absolute;
        left: 48px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--brand-ivory);
    }

    .office .name {
        font-size: 52px;
        font-weight: 500;
    }

    .office .time {
        margin-top: 8px;
        font-family: var(--sans);
        font-size: 24px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--brand-gold);
    }

    .footer {
        margin-top: 44px;
        display: flex;
        align-items: center;
        gap: 36px;
    }

    .cta-pill { padding: 24px 56px; font-size: 32px; }

    .footer .note {
        font-family: var(--sans);
        font-size: 26px;
        color: #6b6560;
    }
</style>
</head>
<body class="still">
    <div class="eyebrow">The Daily Office</div>
    <h1>Pray the hours.</h1>
    <div class="sub">Four short services shape the day — each one ready when you are.</div>

    <div class="offices">
        <div class="office">
            <img src="../../../devotions/static/banner_morning.jpg" alt="">
            <div class="scrim"></div>
            <div class="label">
                <div class="name">Morning</div>
                <div class="time">Begin in the Word</div>
            </div>
        </div>
        <div class="office">
            <img src="../../../devotions/static/banner_midday.jpg" alt="">
            <div class="scrim"></div>
            <div class="label">
                <div class="name">Midday</div>
                <div class="time">Pause &amp; pray</div>
            </div>
        </div>
        <div class="office">
            <img src="../../../devotions/static/banner_evening.jpg" alt="">
            <div class="scrim"></div>
            <div class="label">
                <div class="name">Evening</div>
                <div class="time">Give thanks</div>
            </div>
        </div>
        <div class="office">
            <img src="../../../devotions/static/banner_close_of_day.jpg" alt="">
            <div class="scrim"></div>
            <div class="label">
                <div class="name">Close of Day</div>
                <div class="time">Rest in peace</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="cta-pill">asimplewaytopray.com</div>
        <div class="note">Free on web &amp; Android</div>
    </div>
</body>
</html>
