<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still 01 — Hero</title>
<link rel="stylesheet" href="shared.css">
<style>
    body.still {
        background:
            radial-gradient(1200px 900px at 50% -10%, #7a423c 0%, var(--brand-red) 55%, var(--brand-red-dark) 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .icon-card {
        margin-top: 52px;
        width: 210px;
        height: 210px;
        border-radius: 48px;
        background: var(--brand-ivory);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .icon-card img { width: 168px; height: 168px; }

    .eyebrow { margin-top: 40px; font-size: 30px; }

    h1 {
        margin-top: 18px;
        font-size: 100px;
        font-weight: 500;
        line-height: 1.08;
        color: var(--brand-ivory);
    }

    .divider { width: 560px; margin-top: 32px; font-size: 40px; }

    .tagline {
        margin-top: 32px;
        max-width: 820px;
        font-family: var(--sans);
        font-weight: 400;
        font-size: 37px;
        line-height: 1.55;
        color: rgba(247, 243, 227, 0.88);
    }

    .photo {
        margin-top: 44px;
        width: 900px;
        height: 250px;
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.4);
        border: 3px solid rgba(175, 145, 100, 0.55);
    }

    .photo img { width: 100%; height: 100%; object-fit: cover; }

    .cta-pill { margin-top: 42px; padding: 28px 72px; font-size: 40px; }

    .cta-sub {
        margin-top: 22px;
        font-family: var(--sans);
        font-size: 27px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(247, 243, 227, 0.7);
    }
</style>
</head>
<body class="still">
    <div class="icon-card">
        <img src="../../../devotions/static/icons/android-chrome-512x512.png" alt="">
    </div>
    <div class="eyebrow">Lutheran Daily Prayer</div>
    <h1>A Simple Way<br>to Pray</h1>
    <div class="divider">&#10016;</div>
    <p class="tagline">Daily offices, Scripture &amp; the Small Catechism —
        in the rhythm of the Church Year.</p>
    <div class="photo">
        <img src="../../../devotions/static/banner_morning.jpg" alt="">
    </div>
    <div class="cta-pill">asimplewaytopray.com</div>
    <div class="cta-sub">Free on web &amp; Android</div>
</body>
</html>
