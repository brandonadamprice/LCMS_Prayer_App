<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still 04 — The Church Year</title>
<link rel="stylesheet" href="shared.css">
<style>
    body.still {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 92px 80px 0;
    }

    .eyebrow { font-size: 28px; }

    h1 {
        margin-top: 20px;
        font-size: 88px;
        font-weight: 500;
        line-height: 1.14;
        color: var(--brand-red);
    }

    .sub {
        margin-top: 26px;
        max-width: 840px;
        font-family: var(--sans);
        font-size: 31px;
        line-height: 1.55;
        color: #6b6560;
    }

    .season {
        position: relative;
        margin-top: 44px;
        width: 100%;
        height: 262px;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 32px rgba(50, 46, 44, 0.24);
    }

    .season img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .season .tag {
        position: absolute;
        left: 40px;
        bottom: 32px;
        padding: 14px 36px;
        border-radius: 999px;
        font-family: var(--sans);
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--brand-ivory);
        background: rgba(35, 20, 17, 0.72);
        border: 2px solid rgba(247, 243, 227, 0.5);
    }

    .season .tag.lent { border-color: var(--brand-purple); }
    .season .tag.easter { border-color: var(--brand-gold); }

    .chips {
        margin-top: 52px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px 26px;
        font-family: var(--sans);
        font-size: 27px;
        color: var(--brand-ink);
    }

    .chip {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 30px;
        background: #fff;
        border: 1px solid #e7e1d2;
        border-radius: 999px;
        box-shadow: 0 3px 10px rgba(50, 46, 44, 0.08);
    }

    .chip .dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
    }

    .cta-pill { margin-top: 60px; padding: 26px 60px; font-size: 34px; }
</style>
</head>
<body class="still">
    <div class="eyebrow">The Church Year</div>
    <h1>Prayer that keeps<br>the seasons.</h1>
    <div class="sub">Prayers, readings &amp; devotions change with the liturgical
        calendar &mdash; automatically, all year long.</div>

    <div class="season">
        <img src="../../../devotions/static/banner_lent.jpg" alt="">
        <div class="tag lent">Lent</div>
    </div>
    <div class="season">
        <img src="../../../devotions/static/banner_easter.jpg" alt="">
        <div class="tag easter">Easter</div>
    </div>

    <div class="chips">
        <div class="chip"><span class="dot" style="background:#8e44ad"></span>Advent</div>
        <div class="chip"><span class="dot" style="background:#af9164"></span>Christmas</div>
        <div class="chip"><span class="dot" style="background:#8e44ad"></span>Lent</div>
        <div class="chip"><span class="dot" style="background:#f7f3e3;border:1px solid #af9164"></span>Easter</div>
        <div class="chip"><span class="dot" style="background:#c0392b"></span>Pentecost</div>
    </div>

    <div class="cta-pill">asimplewaytopray.com</div>
</body>
</html>
