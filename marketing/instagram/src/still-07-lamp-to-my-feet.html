<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still 07 — A lamp to my feet (Psalm 119:105)</title>
<link rel="stylesheet" href="shared.css">
<style>
    /* Doré 92, The Journey to Emmaus — a road walked at dusk, for the verse
       about a path. The plate is bright sky above the horizon, so this is the
       one card that needs a heavy scrim to hold the verse. */
    body.verse { --scrim-top: 0.82; }
    /* Crop high so the travellers drop clear of the verse and walk into the
       lower half of the card. */
    .verse-art .plate-art { object-position: 50% 22%; }
</style>
</head>
<body class="verse">
    <div class="verse-art">
        <img class="plate-art" src="art/dore-092-the-journey-to-emmaus.jpg" alt="">
        <div class="tint"></div>
        <div class="scrim"></div>
        <div class="words">Your word is a lamp to my feet
            and a light to my path.</div>
    </div>
    <div class="verse-plate">
        <div class="ref">Psalm 119:105 <span class="esv">ESV</span></div>
        <div class="hook">The whole Bible, one day at a time</div>
    </div>
    <div class="verse-bar">
        <img src="../../../devotions/static/icons/android-chrome-512x512.png" alt="">
        <span class="url">asimplewaytopray.com</span>
    </div>
</body>
</html>
