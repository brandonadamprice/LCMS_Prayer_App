<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Still 08 — I will give you rest (Matthew 11:28)</title>
<link rel="stylesheet" href="shared.css">
<style>
    /* Doré 64, Christ Stilling the Tempest — rest given in the middle of the
       storm, not after it. The storm sky fills the top third, which is exactly
       where the verse sits. */
    body.verse { --scrim-top: 0.5; }
    .verse-art .plate-art { object-position: 50% 60%; }
</style>
</head>
<body class="verse">
    <div class="verse-art">
        <img class="plate-art" src="art/dore-064-christ-stilling-the-tempest.jpg" alt="">
        <div class="tint"></div>
        <div class="scrim"></div>
        <div class="words">Come to me, all who labor and are heavy laden,
            and I will give you rest.</div>
    </div>
    <div class="verse-plate">
        <div class="ref">Matthew 11:28 <span class="esv">ESV</span></div>
        <div class="hook">Close of Day &mdash; end the day in prayer</div>
    </div>
    <div class="verse-bar">
        <img src="../../../devotions/static/icons/android-chrome-512x512.png" alt="">
        <span class="url">asimplewaytopray.com</span>
    </div>
</body>
</html>
