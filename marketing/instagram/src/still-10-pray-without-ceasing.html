<!DOCTYPE html>

<title>Still 10 — Pray without ceasing (1 Thessalonians 5:16-18)</title>

<style>

    .verse-art .plate-art { object-position: 50% 40%; }
</style>
</head>
<body class="verse">
    <div class="verse-art">
        <img class="plate-art" src="art/dore-077-the-pharisee-and-the-publican.jpg" alt="">
        <div class="tint"></div>
        <div class="scrim"></div>
        <div class="words">Rejoice always, pray without ceasing,
            give thanks in all circumstances.</div>
    </div>
    <div class="verse-plate">
        <div class="ref">1 Thessalonians 5:16&ndash;18 <span class="esv">ESV</span></div>
        <div class="hook">Everything for prayer, in one place</div>
    </div>
    <div class="verse-bar">
        <img src="../../../devotions/static/icons/android-chrome-512x512.png" alt="">
        <span class="url">asimplewaytopray.com</span>
