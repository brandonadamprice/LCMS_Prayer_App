name: Deploy production

# Manual only — production is never released by a push. Merges to main land
# on staging (deploy-staging.yml); once staging looks right, release it here:
#
#   Actions → "Deploy production" → Run workflow → Branch: main → confirm: DEPLOY
#
# The image is rebuilt from the same commit by the same composite action the
# staging deploy uses.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to release to the live site"
        required: true
        default: ""

# Never cancel a production deploy in flight — a half-applied release is
# worse than a queued one.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy → production
    runs-on: ubuntu-latest
    # Attach the "production" environment so required reviewers / branch rules
    # apply here if they are ever enabled in repo settings.
    environment: production
    steps:
      # Inputs reach the script through env:, never ${{ }} interpolation into
      # run: — inputs are free text.
      - name: Require the typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DEPLOY" ]; then
            echo "::error::Type DEPLOY in the confirmation box to release to production."
            exit 1
          fi

      # The Run workflow dialog lets you pick any branch; production ships
      # main only.
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys run from main only (got $REF). Merge to main first."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: ./.github/actions/unit-tests

      - uses: ./.github/actions/deploy-cloud-run
        id: deploy
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE_PROD }}
          credentials_json: ${{ secrets.GCP_DEPLOY_SA_JSON }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.CLOUD_RUN_REGION }}

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Production deploy complete"
            echo ""
            echo "- https://asimplewaytopray.com (service URL: $URL)"
            echo "- Commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
